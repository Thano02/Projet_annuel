name: Planification clean + train

on:
  schedule:
    - cron: '0 4 * * 3'     # Chaque mercredi à 4h UTC
  workflow_dispatch:

jobs:
  clean_and_train:
    runs-on: ubuntu-latest

    steps:
    - name: Cloner le dépôt
      uses: actions/checkout@v3

    - name: Installer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Installer les dépendances Python
      run: |
        python -m pip install --upgrade pip
        pip install pandas opencv-python tqdm ultralytics

    - name: Debug – contenu du dépôt
      run: |
        echo "📁 Racine actuelle : $(pwd)"
        echo "Contenu :"
        ls -l
        echo "backend/ :"
        ls -l backend

    - name: Exporter les variables d’environnement PostgreSQL
      run: |
        echo "PGHOST=${{ secrets.PGHOST }}" >> $GITHUB_ENV
        echo "PGPORT=${{ secrets.PGPORT }}" >> $GITHUB_ENV
        echo "PGDATABASE=${{ secrets.PGDATABASE }}" >> $GITHUB_ENV
        echo "PGUSER=${{ secrets.PGUSER }}" >> $GITHUB_ENV
        echo "PGPASSWORD=${{ secrets.PGPASSWORD }}" >> $GITHUB_ENV

    - name: Lancer check_and_run.py
      run: python backend/check_and_run.py
